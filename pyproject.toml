[project]
name = "karmascout"
version = "1.0.0"
description = "Finds German noise-dispute threads on Reddit via public RSS, scores them with an LLM, and drafts comments for manual posting."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "defusedxml>=0.7.1",
    "jinja2>=3.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "requests>=2.32",
    "tenacity>=8.3",
]

[project.scripts]
karmascout = "karmascout.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pre-commit>=4.6.2",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "types-defusedxml>=0.7.0.20260504",
    "types-requests>=2.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/karmascout"]

# ── Ruff ─────────────────────────────────────────────────────────────────────

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "S", "A", "C4", "PTH", "TID"]
[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101", # assert is the point of a test
    "S105", # a dummy key assigned to a variable in a fixture
    "S106", # the same dummy key passed as a keyword argument
]

[tool.ruff.lint.isort]
known-first-party = ["karmascout"]

[tool.ruff.format]
docstring-code-format = true

# ── mypy ─────────────────────────────────────────────────────────────────────

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_unused_ignores = true
disallow_any_generics = true
files = ["src", "tests"]

# ── pytest ───────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src/karmascout"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", 'if __name__ == "__main__":']
